<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="description" content="Visualisez le temps qui passe avec des cercles de progression">
    <title>Time Progress App</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/themes/dark.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header avec bouton de déconnexion (desktop only) -->
        <div class="app-header desktop-only">
            <div class="user-info" id="userInfo" style="display: none;">
                <span id="userEmail"></span>
                <button class="logout-btn" id="logoutBtn">Déconnexion</button>
            </div>
        </div>

        <!-- Menu hamburger (mobile only) -->
        <button class="hamburger-btn mobile-only" id="hamburgerBtn">
            <svg viewBox="0 0 24 24" width="28" height="28">
                <line x1="3" y1="6" x2="21" y2="6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="12" x2="21" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                <line x1="3" y1="18" x2="21" y2="18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>

        <!-- Menu overlay (mobile) -->
        <div class="menu-overlay" id="menuOverlay">
            <div class="menu-content">
                <div class="menu-header">
                    <h3>Menu</h3>
                    <button class="menu-close" id="menuClose">×</button>
                </div>

                <div class="menu-user-info" id="menuUserInfo" style="display: none;">
                    <span id="menuUserEmail"></span>
                </div>

                <div class="menu-section">
                    <h4>Filtrer les timers</h4>
                    <div class="menu-tabs" id="menuTabs">
                        <button class="menu-tab-btn active" data-filter="ongoing">En cours</button>
                        <button class="menu-tab-btn" data-filter="completed">Passés</button>
                        <button class="menu-tab-btn" data-filter="planning">Planning</button>
                    </div>
                </div>

                <div class="menu-section">
                    <button class="menu-logout-btn" id="menuLogoutBtn">Déconnexion</button>
                </div>
            </div>
        </div>

        <!-- Bouton d'ajout en haut à gauche -->
        <button class="add-button" id="addButton" title="Ajouter une période">
            <svg viewBox="0 0 24 24" width="32" height="32">
                <circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/>
                <line x1="12" y1="7" x2="12" y2="17" stroke="currentColor" stroke-width="2"/>
                <line x1="7" y1="12" x2="17" y2="12" stroke="currentColor" stroke-width="2"/>
            </svg>
        </button>

        <!-- Onglets de filtrage (desktop only) -->
        <div class="tabs-container desktop-only" id="tabsContainer">
            <button class="tab-btn active" data-filter="ongoing">En cours</button>
            <button class="tab-btn" data-filter="completed">Passés</button>
            <button class="tab-btn" data-filter="planning">Planning</button>
        </div>

        <!-- Grille des cercles de temps -->
        <div class="timers-grid" id="timersGrid"></div>

        <!-- Vue planning hebdomadaire -->
        <div class="planning-view" id="planningView" style="display:none">
            <div class="planning-toolbar" id="planningToolbar"></div>
            <div class="planning-grid-wrapper">
                <div class="planning-grid" id="planningGrid"></div>
            </div>
        </div>
    </div>

    <!-- Modal pour ajouter une période -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Nouvelle période de temps</h2>

            <!-- Sélecteur de type -->
            <div class="type-selector" id="typeSelector">
                <button type="button" class="type-btn active" data-type="timer">Timer individuel</button>
                <button type="button" class="type-btn" data-type="group">Groupe de périodes</button>
            </div>

            <form id="timerForm" novalidate>
                <!-- Formulaire pour timer individuel -->
                <div id="timerFormFields">
                    <div class="form-group">
                        <label for="title">Titre</label>
                        <input type="text" id="title" required placeholder="Ex: Projet deadline">
                    </div>

                    <div class="form-group">
                        <label for="startDateTime">Date et heure de début</label>
                        <input type="text" id="startDateTime" placeholder="Sélectionnez date et heure">
                    </div>

                    <div class="form-group">
                        <label for="endDateTime">Date et heure de fin</label>
                        <input type="text" id="endDateTime" placeholder="Sélectionnez date et heure">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="granularity">Granularité</label>
                            <select id="granularity">
                                <option value="seconds">Secondes</option>
                                <option value="minutes">Minutes</option>
                                <option value="hours">Heures</option>
                                <option value="days">Jours</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="refreshRate">Fréquence de rafraîchissement</label>
                            <select id="refreshRate">
                                <option value="100">100ms</option>
                                <option value="500">500ms</option>
                                <option value="1000" selected>1 seconde</option>
                                <option value="5000">5 secondes</option>
                                <option value="60000">1 minute</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Formulaire pour groupe -->
                <div id="groupFormFields" style="display: none;">
                    <div class="form-group">
                        <label for="groupTitle">Titre du groupe</label>
                        <input type="text" id="groupTitle" placeholder="Ex: Projet multi-phases">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="groupGranularity">Granularité</label>
                            <select id="groupGranularity">
                                <option value="seconds">Secondes</option>
                                <option value="minutes">Minutes</option>
                                <option value="hours">Heures</option>
                                <option value="days">Jours</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="groupRefreshRate">Fréquence de rafraîchissement</label>
                            <select id="groupRefreshRate">
                                <option value="100">100ms</option>
                                <option value="500">500ms</option>
                                <option value="1000" selected>1 seconde</option>
                                <option value="5000">5 secondes</option>
                                <option value="60000">1 minute</option>
                            </select>
                        </div>
                    </div>

                    <!-- Liste des périodes du groupe -->
                    <div class="periods-section">
                        <div class="periods-header">
                            <label>Périodes (minimum 2)</label>
                            <button type="button" class="btn-add-period" id="addPeriodBtn">+ Ajouter une période</button>
                        </div>
                        <div id="periodsList"></div>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelButton">Annuler</button>
                    <button type="submit" class="btn-submit">Ajouter</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/fr.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

    <!-- Firebase -->
    <script src="firebase-config.js"></script>
    <script type="module">
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
        import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
        import { getFirestore, collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, query, where, onSnapshot } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

        // Initialiser Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Exposer globalement pour app.js
        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firestoreModules = { collection, addDoc, getDocs, doc, updateDoc, deleteDoc, setDoc, query, where, onSnapshot };

        // Vérifier l'authentification
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // Utilisateur connecté
                document.getElementById('userEmail').textContent = user.email;
                document.getElementById('userInfo').style.display = 'flex';

                // Afficher l'email dans le menu mobile aussi
                document.getElementById('menuUserEmail').textContent = user.email;
                document.getElementById('menuUserInfo').style.display = 'block';

                // Charger app.js dynamiquement après l'auth
                const script = document.createElement('script');
                script.src = 'app.js';
                script.onload = () => {
                    console.log('App.js chargé avec succès');
                };
                document.body.appendChild(script);
            } else {
                // Pas connecté, rediriger vers la page de connexion
                window.location.href = 'auth.html';
            }
        });

        // Déconnexion (desktop)
        document.getElementById('logoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'auth.html';
        });

        // Déconnexion (menu mobile)
        document.getElementById('menuLogoutBtn').addEventListener('click', async () => {
            await signOut(auth);
            window.location.href = 'auth.html';
        });
    </script>
</body>
</html>
